<!-- ==================== REUSABLE CINEMA PLAYER HUD CONTROL DOCK ==================== -->
<!-- Center Flash Feedback Ripple / Icon Overlay -->
<div
    id="{=$prefix}-center-flash"
    class="absolute inset-0 flex items-center justify-center pointer-events-none z-30 select-none"
    aria-hidden="true"
>
    <div
        id="{=$prefix}-center-flash-box"
        class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-black/75 backdrop-blur-2xl text-white flex items-center justify-center shadow-[0_0_35px_rgba(0,0,0,0.85)] border border-white/20 opacity-0 pointer-events-none"
    >
        <span
            id="{=$prefix}-center-flash-icon"
            class="material-symbols-outlined text-[36px] md:text-[44px] text-white ml-1"
            style="font-variation-settings: 'FILL' 1"
            >play_arrow</span
        >
    </div>
</div>

<!-- Top Overlay Actions (Close Button - Tự động ẩn khi không di chuột, bỏ hẳn khi phóng to toàn màn hình) -->
<div
    id="{=$prefix}-player-top-actions"
    class="player-top-actions absolute top-4 right-4 z-40 flex items-center gap-3 transition-opacity duration-300"
>
    <button
        id="{=$prefix}-modal-close-btn"
        class="player-modal-close-btn size-10 rounded-full bg-black/70 hover:bg-[#e50914] text-white flex items-center justify-center transition-all cursor-pointer backdrop-blur-sm shadow-xl group/close"
        aria-label="Close Video Player"
        type="button"
    >
        <span class="material-symbols-outlined text-[22px] group-hover/close:rotate-90 transition-transform duration-200">close</span>
    </button>
</div>

<!-- Live Interactive Scrubber & Controls (Cinema HUD Floating Dock) -->
<div id="{=$prefix}-player-control-dock" class="absolute bottom-0 left-0 right-0 z-30 px-4 md:px-6 pb-4 pt-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent flex flex-col gap-2 transition-opacity duration-300 cursor-default">
    <!-- Scrubber Track Timeline with Expanding Track & Pure Red Thumb -->
    <div
        id="{=$prefix}-scrubber-timeline"
        class="relative w-full h-5 flex items-center group/scrubber cursor-pointer select-none"
    >
        <!-- Baseline & Played Track -->
        <div class="relative w-full h-1.5 group-hover/scrubber:h-2.5 bg-white/20 rounded-full overflow-hidden transition-all duration-200">
            <div
                id="{=$prefix}-buffered-bar"
                class="absolute top-0 left-0 h-full w-0 bg-white/30 rounded-full transition-[width] duration-150"
            ></div>
            <div
                id="{=$prefix}-scrubber-fill"
                class="absolute top-0 left-0 h-full w-0 bg-[#e50914] rounded-full shadow-[0_0_12px_rgba(229,9,20,0.8)] transition-all duration-75"
            ></div>
        </div>
        <!-- Pure Red Round Thumb / Scrubber Head (thumb tròn đỏ không trắng) -->
        <div
            id="{=$prefix}-scrubber-thumb"
            class="absolute top-1/2 left-0 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-[#e50914] shadow-[0_0_12px_rgba(229,9,20,0.9)] scale-0 group-hover/scrubber:scale-100 transition-transform duration-150 pointer-events-none z-20"
            style="left: 0%;"
        ></div>
        <!-- Floating Hover Time Tooltip -->
        <div
            id="{=$prefix}-scrubber-tooltip"
            class="absolute -top-7 -translate-x-1/2 opacity-0 pointer-events-none font-mono text-[11px] bg-black/85 px-2 py-0.5 rounded text-white shadow-xl transition-opacity whitespace-nowrap z-40 border border-white/10"
        >
            00:00
        </div>
    </div>

    <!-- Control Toolbar Row -->
    <div
        class="flex items-center justify-between text-white font-label-badge text-label-badge select-none"
    >
        <div class="flex items-center gap-3">
            <button
                id="{=$prefix}-ctrl-play-btn"
                class="w-8 h-8 rounded-full hover:bg-white/15 text-white flex items-center justify-center transition-colors cursor-pointer"
                title="Play / Pause"
                type="button"
            >
                <span
                    id="{=$prefix}-ctrl-play-icon"
                    class="material-symbols-outlined text-[22px]"
                    style="font-variation-settings: 'FILL' 1"
                    >pause</span
                >
            </button>
            <button
                id="{=$prefix}-ctrl-replay-btn"
                class="w-8 h-8 rounded-full hover:bg-white/15 text-white/90 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
                title="Replay 10s"
                type="button"
            >
                <span class="material-symbols-outlined text-[19px]">replay_10</span>
            </button>
            <button
                id="{=$prefix}-ctrl-forward-btn"
                class="w-8 h-8 rounded-full hover:bg-white/15 text-white/90 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
                title="Forward 10s"
                type="button"
            >
                <span class="material-symbols-outlined text-[19px]">forward_10</span>
            </button>
            <span id="{=$prefix}-ctrl-time" class="text-white/80 font-mono text-xs tracking-wider ml-1"
                >00:00 / 00:00</span
            >
        </div>
        <div class="flex items-center gap-3">
            <span
                class="px-2 py-0.5 rounded bg-[#e50914] text-white text-[10px] font-extrabold tracking-wider shadow-[0_0_10px_rgba(229,9,20,0.5)]"
                >4K 60FPS</span
            >
            <!-- Expandable Volume with Pure Red Thumb -->
            <div class="relative flex items-center group/vol">
                <button
                    id="{=$prefix}-ctrl-volume-btn"
                    class="w-8 h-8 rounded-full hover:bg-white/15 text-white/90 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
                    title="Mute / Unmute"
                    type="button"
                >
                    <span id="{=$prefix}-ctrl-volume-icon" class="material-symbols-outlined text-[20px]">volume_up</span>
                </button>
                <div class="w-0 group-hover/vol:w-16 md:group-hover/vol:w-20 transition-all duration-200 overflow-hidden flex items-center px-0 group-hover/vol:px-1.5 cursor-pointer">
                    <div id="{=$prefix}-ctrl-volume-bar" class="relative w-full h-1.5 bg-white/20 rounded-full py-2 flex items-center">
                        <div class="relative w-full h-1.5 bg-white/20 rounded-full">
                            <div id="{=$prefix}-ctrl-volume-fill" class="absolute top-0 left-0 h-full w-1/2 bg-white rounded-full"></div>
                            <div id="{=$prefix}-ctrl-volume-thumb" class="absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-white shadow-[0_0_8px_rgba(255,255,255,0.8)] scale-0 group-hover/vol:scale-100 transition-transform" style="left: 50%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button
                id="{=$prefix}-ctrl-fullscreen-btn"
                class="w-8 h-8 rounded-full hover:bg-white/15 text-white/90 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
                title="Fullscreen"
                type="button"
            >
                <span id="{=$prefix}-ctrl-fullscreen-icon" class="material-symbols-outlined text-[20px]">fullscreen</span>
            </button>
        </div>
    </div>
</div>
